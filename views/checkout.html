{% extends 'layouts/main.html' %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Accept a payment</title>
  <meta name="description" content="A demo of a payment on Stripe" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {% block head %}
  <link rel="stylesheet" href="/css/checkout.css" />
  <script src="https://js.stripe.com/v3/"></script>
  <script src="/js/checkout.js" defer></script>
<script>
  const AMOUNT = {{ amount | tojson }};
  const TITLE = {{ title | tojson }};
  const ITEM_ID = {{ item_id | tojson }};
  const STRIPE_PUBLISHABLE_KEY = {{ stripe_pk | tojson }};
</script>
</head>
{% endblock %}

{% block content %}
<div class="row justify-content-md-center">
  <div class="col-6">
    <div class="text-center mt-40">
      <h1>
        Checkout — Stripe Press
      </h1>
      <h5 class="text-secondary">
        {{ title }}
      </h5>
      <hr class="mt-40">
      <div class="mt-20 text-info">
        Total due: $<span class="amount" data-amount="{{ amount }}"></span>
      </div>
    </div>
    <div class="card box-shadow mt-40">
      <div class="card-body">
        <!-- Display a payment form -->
        <form id="payment-form">
          <div>
            <label for="email">Email address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="you@email.com">
          </div>
          <div id="payment-element">
            <!--Stripe.js injects the Payment Element-->
          </div>
          <button id="submit">
            <div class="spinner hidden" id="spinner"></div>
            <span id="button-text">Pay now</span>
          </button>
          <div id="payment-message" class="hidden"></div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
